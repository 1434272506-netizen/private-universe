name: Garden - offline gift and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  offline:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      content_sha: ${{ steps.manifest.outputs.content_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate, build and package the offline gift
        run: npm run package
      - name: Record the authored content version
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw dist/release-manifest.json | ConvertFrom-Json
          "content_sha=$($manifest.contentSha256)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: garden-offline-gift
          path: release/*-离线礼物版.zip
          if-no-files-found: error
          retention-days: 30

  build-pages:
    runs-on: ubuntu-latest
    needs: offline
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm run check:content
      - name: Build for the actual Pages base path
        run: npm run build
        env:
          GARDEN_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Require identical authored content for both deliveries
        env:
          OFFLINE_CONTENT_SHA: ${{ needs.offline.outputs.content_sha }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const manifest=JSON.parse(fs.readFileSync('dist/release-manifest.json','utf8')); if(manifest.contentSha256!==process.env.OFFLINE_CONTENT_SHA) throw new Error('Offline and Pages content differ');"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
